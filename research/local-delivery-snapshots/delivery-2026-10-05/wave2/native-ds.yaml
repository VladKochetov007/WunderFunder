name: wunder-twostream-native-audit-20261005
cmd: python3 native_audit.py ${WEIGHTS} ${PROBE} ${ENGINE} ${REPORT}
env:
  docker:
    image: python:3.11-slim-bookworm
  python:
    type: manual
    version: 3.11
    requirements-file: requirements.txt
inputs:
  - tstream_fold3_v2.npz: WEIGHTS
  - tstream_fold3_v2.probe.npz: PROBE
  - engine.tar.gz: ENGINE
outputs:
  - native-datasphere.json: REPORT
cloud-instance-type: c1.4
