name: wunder-conditional-event-race-20261005
cmd: python3 race_probe.py ${DATA} ${HEAD} ${REPORT} ${ARTIFACT}
env:
  python:
    type: manual
    version: 3.12
    requirements-file: requirements.txt
    pip:
      extra-index-urls:
        - https://download.pytorch.org/whl/cu126
inputs:
  - ../2026-10-05-wave3/probe.npz: DATA
  - parent-head.npz: HEAD
outputs:
  - race-datasphere.json: REPORT
  - race-artifacts.npz: ARTIFACT
cloud-instance-type: gt4i.1
