[package]
name = "wnn_native"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false

[lib]
name = "wnn_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]
extension-module = ["python", "pyo3/extension-module"]

[dependencies]
libm = "0.2.16"
pyo3 = { version = "0.29.2", features = ["abi3-py311"], optional = true }
numpy = { version = "0.29.0", optional = true }
bytemuck = { version = "1.25", features = ["derive"] }

[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
