name: Training code quality
on:
  pull_request:
    branches: [main, research-team]
  push:
    branches: [main, research-team]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.11"
          python-version: "3.12"
          enable-cache: false
      - name: Ruff lint
        run: uv run --no-project --with ruff==0.16.7 ruff check src/wnn/training scripts/train_rnn.py scripts/e540_cli_preflight.py scripts/check_training_structure.py
      - name: Ruff format
        run: uv run --no-project --with ruff==0.16.7 ruff format --check src/wnn/training scripts/train_rnn.py scripts/e540_cli_preflight.py scripts/check_training_structure.py
      - name: Module and function boundaries
        run: uv run --no-project python scripts/check_training_structure.py
