name: Harness2 workflow integration
on:
  pull_request:
    paths:
      - src/wnn/harness2_workflow/**
      - scripts/harness2_workflow.py
      - tools/harness2/**
      - tests/test_harness2*.py
      - .github/workflows/harness2.yml
  push:
    paths:
      - src/wnn/harness2_workflow/**
      - scripts/harness2_workflow.py
      - tools/harness2/**
      - tests/test_harness2*.py
      - .github/workflows/harness2.yml
permissions:
  contents: read
jobs:
  offline-integration:
    timeout-minutes: 10
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r tools/harness2/requirements.txt pytest
      - run: python -m pytest -q tests/test_harness2_task.py tests/test_harness2_workflow.py
